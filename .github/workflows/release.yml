name: release

# با زدن تگ v* یک رلیز منتشر می‌شود؛ workflow_dispatch فقط بیلد را آزمود
# و چیزی منتشر نمی‌کند.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  CGO_ENABLED: '0'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test ./...

  build:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            ext: ''
          - goos: windows
            goarch: amd64
            ext: '.exe'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build npv-${{ matrix.goos }}-${{ matrix.goarch }}
        run: |
          pkg="npv-${{ matrix.goos }}-${{ matrix.goarch }}"
          mkdir -p "stage/$pkg" dist
          GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} \
            go build -trimpath -ldflags '-s -w' \
            -o "stage/$pkg/npv${{ matrix.ext }}" ./cmd/npv-go
          cp LICENSE README.md "stage/$pkg/"

      - name: Smoke test the linux binary
        if: matrix.goos == 'linux'
        run: |
          ./stage/npv-linux-amd64/npv list internal/npvs/testdata/BOMB.npvs > list.txt
          head -n 3 list.txt
          ./stage/npv-linux-amd64/npv list -json internal/npvs/testdata/BOMB.npvs > list.json
          python3 -c 'import json; d=json.load(open("list.json")); print("json ok:", d["total"], "configs")'

      - name: Package
        run: |
          pkg="npv-${{ matrix.goos }}-${{ matrix.goarch }}"
          if [ '${{ matrix.goos }}' = windows ]; then
            (cd stage && zip -rq "../dist/$pkg.zip" "$pkg")
          else
            tar -C stage -czf "dist/$pkg.tar.gz" "$pkg"
          fi
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
          retention-days: 30

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Checksums
        run: |
          cd artifacts
          sha256sum * > checksums.txt
          cat checksums.txt

      - name: Notes
        run: |
          cat > notes.md <<'EOF'
          باینری آماده. موتور xray-core داخل خود باینری است و فایل‌های جدول
          whitebox هم embed شده‌اند، پس جزئی غیر از این آرشیو لازم نیست.

          ```bash
          tar -xzf npv-linux-amd64.tar.gz
          ./npv-linux-amd64/npv connect example.npvs
          ```

          ```powershell
          Expand-Archive npv-windows-amd64.zip .
          .\npv-windows-amd64\npv.exe connect example.npvs
          ```

          برای MischiefPingu: فایل `npv` (یا `npv.exe`) را در پوشهٔ دادهٔ برنامه
          بگذارید تا هستهٔ NPV انتخاب شود.

          SHA256 در `checksums.txt`.
          EOF

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" artifacts/* \
            --title "npv $GITHUB_REF_NAME" \
            --notes-file notes.md
          gh release view "$GITHUB_REF_NAME"
